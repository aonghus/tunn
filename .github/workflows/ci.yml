name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: |
          mkdir -p .cache
          GOCACHE=$(pwd)/.cache go test ./...

      - name: Install sshd (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q openssh-server
          fi

      - name: Set up ssh client
        run: scripts/smoke/setup-client.sh ${{ runner.os == 'Windows' && '22' || '2222' }}

      - name: Start test sshd (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/smoke/sshd-unix.sh 2222

      - name: Start test sshd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke/sshd-windows.ps1

      - name: Smoke test
        run: scripts/smoke/run.sh
