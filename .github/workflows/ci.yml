name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: |
          mkdir -p .cache
          GOCACHE=$(pwd)/.cache go test ./...

      - name: Install sshd (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q openssh-server
          fi

      - name: Set up ssh client
        run: scripts/smoke/setup-client.sh ${{ runner.os == 'Windows' && '22' || '2222' }}

      - name: Start test sshd (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/smoke/sshd-unix.sh 2222

      - name: Start test sshd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke/sshd-windows.ps1

      - name: Smoke test
        run: scripts/smoke/run.sh

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        # powershell = Windows PowerShell 5.1, the version every Windows machine has.
        shell: [pwsh, powershell]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      # Piped to iex, as in the README one-liner. Installs the latest release.
      - name: Install
        run: Get-Content -Raw scripts/install.ps1 | Invoke-Expression

      - name: Install again (upgrade path)
        run: Get-Content -Raw scripts/install.ps1 | Invoke-Expression

      - name: Verify
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = 0
          function Check($ok, $msg) {
            if ($ok) { Write-Host "PASS: $msg" } else { Write-Host "FAIL: $msg"; $script:fail++ }
          }

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\tunn'
          $exe = Join-Path $dir 'tunn.exe'
          Check (Test-Path $exe) "tunn.exe installed at $exe"

          # The binary's PE machine type should match the OS.
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          $binArch = switch ($machine) { 0x8664 { 'amd64' } 0xAA64 { 'arm64' } default { 'unknown' } }
          $osArch = if ('${{ matrix.os }}' -eq 'windows-11-arm') { 'arm64' } else { 'amd64' }
          Check ($binArch -eq $osArch) "binary is $binArch on an $osArch runner"

          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $count = @($userPath -split ';' | Where-Object { $_ -eq $dir }).Count
          Check ($count -eq 1) "user PATH contains $dir exactly once (found $count)"

          # A fresh shell only knows the registry PATH.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + $userPath
          $version = (tunn version | Out-String).Trim()
          Check ($version -match '^v\d+\.\d+\.\d+') "tunn version runs (got '$version')"

          # The first install writes a starter config that tunn can parse; the second leaves it alone.
          $config = "$env:USERPROFILE\.tunnrc"
          Check (Test-Path $config) "starter config created at $config"
          # Continue: Windows PowerShell 5.1 turns redirected stderr into errors, which Stop would throw.
          $parse = (& { $ErrorActionPreference = 'Continue'; tunn -d nosuchtunnel 2>&1 } | Out-String).Trim()
          Check ($parse -match 'no tunnels found matching') "tunn parses the starter config (got '$parse')"
          Add-Content -Path $config -Value '# edited by user' -Encoding ascii
          $again = Get-Content -Raw scripts/install.ps1 | Invoke-Expression *>&1 | Out-String
          Check ($again -match 'left unchanged' -and (Get-Content -Raw $config) -match 'edited by user') "reinstall keeps an existing config"
          Check (-not (Get-Process notepad -ErrorAction SilentlyContinue)) "notepad not opened in CI"

          # Upgrading while tunn runs must stop with advice, not a raw file error.
          Set-Content -Path "$env:USERPROFILE\.tunnrc" -Encoding ascii -Value "tunnels:`n  t:`n    host: unreachable.invalid`n    ports:`n      - 18999:18999"
          tunn --detach t | Out-Host
          $out = try { Get-Content -Raw scripts/install.ps1 | Invoke-Expression; 'no error' } catch { $_.Exception.Message }
          Write-Host "installer said: $out"
          Check ($out -match "Run 'tunn stop'") "installer refuses to replace a running tunn"
          tunn stop | Out-Host

          if ($fail -gt 0) { throw "$fail check(s) failed" }
